name: CI/CD Build - Push - Deploy

on:
  push:
    branches:
      - develop
    paths:
      - '**/*.py'  # Watch Python files
      - 'requirements.txt'  # Watch dependency file
      - 'Dockerfile'  # Watch Dockerfile
      - '.github/workflows/ci-cd-develop.yml'  # Watch this workflow file

env:
  IMAGE_NAME: davidvothe/medical-chatbot  # New image name for chatbot
  APP_PORT: 8000  # Default port, override if needed
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Inject API key from secrets

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Match Python version in Dockerfile
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          pip install pytest
          pytest  # Replace with your test command, e.g., 'pytest tests/'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Ensure API key for tests
          
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:develop-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:develop-latest
          build-args: |
            APP_PORT=${{ env.APP_PORT }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ env.IMAGE_NAME }}:develop-latest
            
            # Stop and remove existing chatbot container
            docker stop chatbot-backend || true
            docker rm chatbot-backend || true
            
            # Run new container
            docker run -d \
              --name chatbot-backend \
              --network host \
              -e PYTHONUNBUFFERED=1 \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -e APP_PORT=${{ env.APP_PORT }} \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              ${{ env.IMAGE_NAME }}:develop-latest