name: CI/CD Build - Push - Deploy

on:
  push:
    branches:
      - develop
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/ci-cd-develop.yml'

env:
  IMAGE_NAME: davidvothe/medical-chatbot
  APP_PORT: 8000
  CONTAINER_NAME: chatbot-backend

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run basic syntax check
        run: |
          python -m py_compile server-chatbot.py || echo "Syntax check completed"

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=develop-
            type=raw,value=develop-latest
            
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            echo "Pulling latest Docker image..."
            docker pull ${{ env.IMAGE_NAME }}:develop-latest
            
            echo "Stopping existing container..."
            if docker ps -q -f name=${{ env.CONTAINER_NAME }}; then
              docker stop ${{ env.CONTAINER_NAME }} || true
              sleep 5
            fi
            
            echo "Removing existing container..."
            docker rm ${{ env.CONTAINER_NAME }} || true
            
            echo "Cleaning up old images..."
            docker images ${{ env.IMAGE_NAME }} --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | \
              tail -n +2 | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true
            
            docker network create chatbot-network || true
            
            echo "Starting new container..."
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --network chatbot-network \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:8000 \
              -e PYTHONUNBUFFERED=1 \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -e APP_PORT=8000 \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              --health-cmd="curl -f http://localhost:8000/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              ${{ env.IMAGE_NAME }}:develop-latest
            
            echo "Waiting for container to be healthy..."
            timeout=60
            while [ $timeout -gt 0 ]; do
              if docker ps --filter "name=${{ env.CONTAINER_NAME }}" --filter "health=healthy" -q; then
                echo "Container is healthy!"
                break
              fi
              echo "Waiting... ($timeout seconds remaining)"
              sleep 5
              timeout=$((timeout-5))
            done
            
            echo "Container status:"
            docker ps -f name=${{ env.CONTAINER_NAME }}
            
            echo "Recent logs:"
            docker logs --tail 20 ${{ env.CONTAINER_NAME }}
            
            echo "Deployment completed successfully!"
